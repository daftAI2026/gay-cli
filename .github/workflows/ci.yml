name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install devDependencies
        run: npm ci
      - name: Typecheck TypeScript source
        run: npm run typecheck
      - name: Verify compiled bin/gay.mjs is in sync with src/gay.mts
        run: |
          npm run build
          git diff --exit-code bin/gay.mjs

  unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Unix test suite
        run: sh ./tests/test.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Windows test suite
        shell: powershell
        run: .\tests\test.ps1
